spring:
  application:
    name: api-gateway
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                          allowedOrigins:
                            - "http://localhost:5173"
                            - "http://localhost:3000"
                          allowedMethods: "*"
                          allowedHeaders: "*"
                          allowCredentials: true

management:
  server:
    port: 9051
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans