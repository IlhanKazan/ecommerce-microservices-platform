server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${PRODUCT_DB_NAME}
    username: ${PRODUCT_DB_USERNAME}
    password: ${PRODUCT_DB_PASSWORD}
  kafka:
    producer:
      bootstrap-servers: localhost:29092
    consumer:
      bootstrap-servers: localhost:29092
      group-id: product-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

security:
  oauth2:
    resource server:
      jwt:
        issuer-uri: http://localhost:8080/realms/${REALM_NAME}

minio:
  url: http://localhost:9005
  public-url: http://localhost:9005
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${USER_MINIO_BUCKET}
