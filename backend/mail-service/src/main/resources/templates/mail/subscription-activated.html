<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Aboneliğiniz Başlatıldı</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f5f5f5; font-family: Arial, sans-serif; }
        .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; overflow: hidden; }
        .header { background-color: #4527a0; padding: 32px; text-align: center; }
        .header h1 { color: #ffffff; margin: 0; font-size: 24px; }
        .body { padding: 32px; color: #333333; }
        .body h2 { font-size: 20px; margin-top: 0; }
        .body p { line-height: 1.6; }
        .badge { display: inline-block; background: #ede7f6; color: #4527a0; border-radius: 4px; padding: 6px 14px; font-weight: bold; font-size: 15px; margin: 16px 0; }
        .info-box { background: #f3f0ff; border-left: 4px solid #4527a0; padding: 12px 16px; margin: 16px 0; border-radius: 4px; }
        .footer { background: #f5f5f5; padding: 20px 32px; text-align: center; color: #888888; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>E-Commerce Platform</h1>
    </div>
    <div class="body">
        <h2>Aboneliğiniz Başlatıldı!</h2>
        <p>Merhaba,</p>
        <p>Mağazanız için <strong th:text="${planName}">—</strong> planınız başarıyla aktive edildi.</p>
        <div class="badge">✓ Abonelik Aktif</div>
        <div class="info-box">
            <p style="margin: 0;"><strong>Plan:</strong> <span th:text="${planName}">—</span></p>
            <p style="margin: 8px 0 0;"><strong>Sonraki ödeme tarihi:</strong> <span th:text="${nextBillingDate}">—</span></p>
        </div>
        <p>Mağazanız artık aktif. Ürünlerinizi ekleyerek satışa başlayabilirsiniz!</p>
    </div>
    <div class="footer">
        <p>Bu e-posta otomatik olarak gönderilmiştir. Lütfen yanıtlamayınız.</p>
    </div>
</div>
</body>
</html>
